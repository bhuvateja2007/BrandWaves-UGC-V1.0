<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CROWD CANVAS — Motion Graphic Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle vertical line entrance */
    @keyframes lineFade {
      0% { height: 0px; opacity: 0; }
      100% { height: 72px; opacity: 0.6; }
    }

    @keyframes labelReveal {
      0% { opacity: 0; transform: translateY(-4px); letter-spacing: 0.28em; }
      100% { opacity: 1; transform: translateY(0); letter-spacing: 0.35em; }
    }

    .animate-label {
      animation: labelReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-line {
      animation: lineFade 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    /* Accessibility reduced motion fallback handled in script & css */
    @media (prefers-reduced-motion: reduce) {
      .animate-label { animation: none; opacity: 1; }
      .animate-line { animation: none; opacity: 0.6; height: 72px; }
    }
  </style>
</head>
<body class="relative w-screen h-screen bg-white overflow-hidden flex flex-col justify-between">

  <!-- Top 55-65% Negative Space with minimal central typographic label & hairline -->
  <div class="relative w-full h-[58vh] flex flex-col items-center justify-start pt-16 md:pt-24 z-20 pointer-events-none">
    
    <!-- Central Label -->
    <div class="flex flex-col items-center select-none">
      <span class="animate-label text-[10px] sm:text-[11px] md:text-[12px] font-medium tracking-[0.35em] text-[#8E8E93] uppercase font-mono">
        CROWD CANVAS
      </span>
      
      <!-- Subtitle metadata footnote -->
      <span class="text-[9px] tracking-[0.25em] text-[#C7C7CC] uppercase mt-1.5 font-light">
        SKIPER 39 / LIVING MONOCHROME
      </span>

      <!-- Elegant hairline divider extending downward -->
      <div class="w-[1px] bg-gradient-to-b from-[#8E8E93] to-transparent mt-5 animate-line opacity-0 h-[72px]"></div>
    </div>

    <!-- Minimal sound / interactive hint in quiet corners -->
    <div class="absolute top-6 left-8 hidden md:flex items-center space-x-2 text-[10px] tracking-widest text-[#B0B0B5] uppercase font-mono">
      <span class="w-1.5 h-1.5 rounded-full bg-black animate-pulse"></span>
      <span>CONTINUOUS PASSAGE</span>
    </div>

    <div class="absolute top-6 right-8 hidden md:flex items-center space-x-4 text-[10px] tracking-widest text-[#A0A0A5] font-mono uppercase">
      <span id="crowd-count">48 CHARACTERS</span>
      <span>•</span>
      <span>MONOCHROME STUDY</span>
    </div>
  </div>

  <!-- Bottom 35-45% Living Crowd Motion Viewport -->
  <div class="absolute inset-x-0 bottom-0 w-full h-[46vh] sm:h-[45vh] md:h-[42vh] overflow-hidden z-10 pointer-events-auto">
    <!-- HTML5 Canvas for ultra-crisp 60fps organic crowds -->
    <canvas id="crowdCanvas" class="w-full h-full block"></canvas>
  </div>

  <!-- Client Script for Hand-Drawn Procedural Character Generation & GSAP-Style Physics Motion -->
  <script>
    (function () {
      const canvas = document.getElementById('crowdCanvas');
      const ctx = canvas.getContext('2d');
      const countDisplay = document.getElementById('crowd-count');

      let width = 0;
      let height = 0;
      let dpr = window.devicePixelRatio || 1;
      let characters = [];
      let animationFrameId;

      // Character archetypes for distinct hand-drawn editorial silhouettes
      // Each archetype specifies hairstyle, glasses/eyes, accessories, clothes pattern
      const archetypes = [
        { type: 'afro_turtleneck', hair: 'afro', hat: null, glasses: false, clothing: 'turtleneck', beard: false },
        { type: 'beanie_scarf', hair: 'short', hat: 'beanie', glasses: true, clothing: 'heavy_coat', beard: true },
        { type: 'ponytail_collar', hair: 'ponytail', hat: null, glasses: false, clothing: 'collar', beard: false },
        { type: 'beret_chic', hair: 'bob', hat: 'beret', glasses: true, clothing: 'striped_crew', beard: false },
        { type: 'messy_hoodie', hair: 'messy', hat: null, glasses: false, clothing: 'hoodie', beard: false },
        { type: 'fedora_overcoat', hair: 'crop', hat: 'fedora', glasses: false, clothing: 'overcoat', beard: true },
        { type: 'tall_bun', hair: 'topbun', hat: null, glasses: true, clothing: 'crew', beard: false },
        { type: 'headphones_jacket', hair: 'wavy', hat: 'headphones', glasses: false, clothing: 'bomber', beard: false },
        { type: 'slick_tie', hair: 'slick', hat: null, glasses: true, clothing: 'suit_tie', beard: true },
        { type: 'cap_street', hair: 'short', hat: 'baseball_cap', glasses: false, clothing: 'puffer', beard: false },
        { type: 'curly_bob', hair: 'curls', hat: null, glasses: false, clothing: 'vneck', beard: false },
        { type: 'long_drapes', hair: 'long_straight', hat: null, glasses: false, clothing: 'cloak', beard: false }
      ];

      // Resize Canvas with DPR fidelity
      function resize() {
        dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.scale(dpr, dpr);

        if (characters.length === 0) {
          initCharacters();
        } else {
          // Adjust base layers to current height
          characters.forEach(c => {
            c.baseY = height + 10;
          });
        }
      }

      class Character {
        constructor(initialX, forceDirection) {
          this.reset(initialX, forceDirection);
          this.entranceDelay = Math.random() * 0.8;
          this.currentAlpha = 0;
        }

        reset(xOverride = null, forceDirection = null) {
          // Assign visual depth layer: 0 (background, small, slower), 1 (midground), 2 (foreground, large, faster)
          const layerRand = Math.random();
          if (layerRand < 0.35) {
            this.layer = 0; // background
            this.scale = 0.72 + Math.random() * 0.12;
            this.yOffset = -height * 0.22 - Math.random() * (height * 0.20);
            this.speedFactor = 0.55 + Math.random() * 0.35;
          } else if (layerRand < 0.72) {
            this.layer = 1; // midground
            this.scale = 0.90 + Math.random() * 0.15;
            this.yOffset = -height * 0.10 - Math.random() * (height * 0.15);
            this.speedFactor = 0.85 + Math.random() * 0.4;
          } else {
            this.layer = 2; // foreground
            this.scale = 1.15 + Math.random() * 0.25;
            this.yOffset = 0 + Math.random() * 15;
            this.speedFactor = 1.25 + Math.random() * 0.5;
          }

          // Direction: -1 (moving left) or 1 (moving right)
          this.direction = forceDirection !== null ? forceDirection : (Math.random() > 0.52 ? 1 : -1);

          // Speed in px/second
          this.baseSpeed = (24 + Math.random() * 28) * this.speedFactor;
          this.speed = this.baseSpeed * this.direction;

          // Bobbing physics
          this.bobFrequency = (2.2 + Math.random() * 1.4);
          this.bobAmplitude = (2.2 + Math.random() * 2.5) * this.scale;
          this.bobPhase = Math.random() * Math.PI * 2;

          // Position
          const margin = 140 * this.scale;
          if (xOverride !== null) {
            this.x = xOverride;
          } else {
            this.x = this.direction === 1 ? -margin - Math.random() * 300 : width + margin + Math.random() * 300;
          }

          this.baseY = height + 10;
          this.y = this.baseY + this.yOffset;

          // Archetype profile
          this.archetype = archetypes[Math.floor(Math.random() * archetypes.length)];
          this.expressionSeed = Math.random();
          this.tilt = (Math.random() - 0.5) * 0.08;
          this.stride = 0;
          this.currentAlpha = 1;
        }

        update(dt) {
          // Horizontal movement
          this.x += this.speed * dt;
          this.stride += dt * this.bobFrequency * Math.PI * 2;

          // Organic vertical bobbing sync with walking pace
          this.currentBob = Math.sin(this.stride + this.bobPhase) * this.bobAmplitude;

          // Head sway
          this.headSway = Math.cos(this.stride * 0.5 + this.bobPhase) * 0.035;

          // Wrap around logic with recycling
          const margin = 160 * this.scale;
          if (this.direction === 1 && this.x > width + margin) {
            this.reset(-margin - (Math.random() * 120), 1);
          } else if (this.direction === -1 && this.x < -margin) {
            this.reset(width + margin + (Math.random() * 120), -1);
          }
        }

        draw(ctx) {
          ctx.save();
          
          // Translate to character base anchor
          const drawY = this.y + this.currentBob;
          ctx.translate(this.x, drawY);

          // Facing direction: character mirrors based on velocity
          ctx.scale(this.direction * this.scale, this.scale);
          ctx.rotate(this.tilt + this.headSway);

          // Shared Hand-Drawn Editorial Ink Stylings
          ctx.lineWidth = 2.4;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#000000';
          ctx.fillStyle = '#000000';

          /* ----------------- 1. TORSO & CLOTHING (Solid Black & Graphic Ink) ----------------- */
          ctx.beginPath();
          // Draw broad rounded shoulder contour
          ctx.moveTo(-45, 0);
          ctx.quadraticCurveTo(-48, -48, -25, -60);
          ctx.quadraticCurveTo(0, -68, 25, -60);
          ctx.quadraticCurveTo(48, -48, 45, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Costume Details based on Archetype
          if (this.archetype.clothing === 'turtleneck') {
            // High black collar
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.roundRect(-16, -74, 32, 18, [4, 4, 2, 2]);
            ctx.fill();
            ctx.stroke();
            // Collar fold line in white
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(-12, -65);
            ctx.lineTo(12, -65);
            ctx.stroke();
          } else if (this.archetype.clothing === 'hoodie') {
            // Hood folds & drawstrings
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(0, -60, 20, 0.4, Math.PI - 0.4, false);
            ctx.stroke();
            // Cords
            ctx.beginPath();
            ctx.moveTo(-6, -55);
            ctx.lineTo(-6, -35);
            ctx.moveTo(6, -55);
            ctx.lineTo(6, -37);
            ctx.stroke();
          } else if (this.archetype.clothing === 'collar' || this.archetype.clothing === 'suit_tie') {
            // Crisp white shirt collar triangles
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(0, -56);
            ctx.lineTo(-14, -68);
            ctx.lineTo(-3, -68);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, -56);
            ctx.lineTo(14, -68);
            ctx.lineTo(3, -68);
            ctx.closePath();
            ctx.fill();

            if (this.archetype.clothing === 'suit_tie') {
              // Black skinny tie
              ctx.fillStyle = '#000000';
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(-3, -56);
              ctx.lineTo(3, -56);
              ctx.lineTo(5, -28);
              ctx.lineTo(0, -20);
              ctx.lineTo(-5, -28);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          } else if (this.archetype.clothing === 'striped_crew') {
            // Subtle monochrome stripes
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1.5;
            for (let s = -48; s <= -15; s += 10) {
              ctx.beginPath();
              ctx.moveTo(-36, s);
              ctx.lineTo(36, s);
              ctx.stroke();
            }
          }

          /* ----------------- 2. NECK & HEAD (White Face with Pure Black Linework) ----------------- */
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2.4;

          // Neck
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.rect(-10, -78, 20, 16);
          ctx.fill();
          ctx.stroke();

          // Head Oval
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.ellipse(0, -96, 22, 27, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          /* ----------------- 3. EYES, NOSE, MOUTH (Graphic Editorial Expressions) ----------------- */
          ctx.fillStyle = '#000000';
          ctx.lineWidth = 2;

          // Eyes or Spectacles
          if (this.archetype.glasses) {
            // Bold round or rectangular spectacles
            ctx.lineWidth = 2.2;
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(-7, -97, 6.5, 0, Math.PI * 2);
            ctx.arc(7, -97, 6.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Bridge
            ctx.beginPath();
            ctx.moveTo(-0.5, -97);
            ctx.lineTo(0.5, -97);
            ctx.stroke();
            // Pupils inside glasses
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-6, -97, 1.8, 0, Math.PI * 2);
            ctx.arc(8, -97, 1.8, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Hand-drawn expressive eyes
            if (this.expressionSeed > 0.6) {
              // Open focused dots
              ctx.beginPath();
              ctx.arc(-7, -97, 2.2, 0, Math.PI * 2);
              ctx.arc(7, -97, 2.2, 0, Math.PI * 2);
              ctx.fill();
            } else if (this.expressionSeed > 0.3) {
              // Contemplative slit eyes
              ctx.lineWidth = 2.4;
              ctx.beginPath();
              ctx.moveTo(-10, -97);
              ctx.lineTo(-4, -96);
              ctx.moveTo(4, -96);
              ctx.lineTo(10, -97);
              ctx.stroke();
            } else {
              // Playful arched eyes
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(-7, -96, 3, Math.PI, 0, false);
              ctx.arc(7, -96, 3, Math.PI, 0, false);
              ctx.stroke();
            }
          }

          // Eyebrows
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-11, -104);
          ctx.lineTo(-4, -103);
          ctx.moveTo(4, -103);
          ctx.lineTo(11, -104);
          ctx.stroke();

          // Editorial Minimal Nose (simple stroke angle)
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(1, -95);
          ctx.lineTo(2, -90);
          ctx.lineTo(-1, -88);
          ctx.stroke();

          // Mouth
          ctx.beginPath();
          if (this.expressionSeed > 0.5) {
            // Calm subtle line
            ctx.moveTo(-5, -82);
            ctx.lineTo(5, -82);
          } else {
            // Understated smile
            ctx.arc(0, -84, 5, 0.2, Math.PI - 0.2, false);
          }
          ctx.stroke();

          // Facial Hair / Beard
          if (this.archetype.beard) {
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(0, -84, 15, 0.1, Math.PI - 0.1, false);
            ctx.lineTo(0, -74);
            ctx.closePath();
            ctx.fill();
          }

          /* ----------------- 4. HAIR & HEADWEAR (Black Shapes with Negative Ink) ----------------- */
          ctx.fillStyle = '#000000';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2.4;

          const h = this.archetype.hair;
          const hat = this.archetype.hat;

          if (hat === 'beanie') {
            // Folded ribbed beanie sitting snug
            ctx.beginPath();
            ctx.ellipse(0, -112, 22, 17, 0, Math.PI, 0, true);
            ctx.quadraticCurveTo(24, -103, 0, -103);
            ctx.quadraticCurveTo(-24, -103, -22, -112);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Cuff lines
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(-18, -107);
            ctx.lineTo(18, -107);
            ctx.stroke();
          } else if (hat === 'beret') {
            // Slanted French artistic beret
            ctx.beginPath();
            ctx.moveTo(-24, -108);
            ctx.quadraticCurveTo(-20, -128, 12, -124);
            ctx.quadraticCurveTo(30, -116, 18, -106);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Little top stem
            ctx.beginPath();
            ctx.moveTo(2, -126);
            ctx.lineTo(4, -131);
            ctx.stroke();
          } else if (hat === 'fedora') {
            // Wide brimmed editorial fedora
            ctx.beginPath();
            ctx.ellipse(0, -108, 38, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Crown
            ctx.beginPath();
            ctx.moveTo(-18, -108);
            ctx.lineTo(-14, -126);
            ctx.quadraticCurveTo(0, -130, 14, -126);
            ctx.lineTo(18, -108);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (hat === 'baseball_cap') {
            // Curved visor cap
            ctx.beginPath();
            ctx.arc(0, -110, 22, Math.PI, 0, false);
            ctx.fill();
            ctx.stroke();
            // Visor extending forward
            ctx.beginPath();
            ctx.moveTo(14, -106);
            ctx.quadraticCurveTo(38, -104, 34, -98);
            ctx.quadraticCurveTo(16, -99, 10, -104);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (hat === 'headphones') {
            // Ear cups + headband
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, -102, 26, Math.PI * 0.9, Math.PI * 0.1, false);
            ctx.stroke();
            // Cans on ears
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(-25, -103, 6, 14);
            ctx.rect(19, -103, 6, 14);
            ctx.fill();
            ctx.stroke();
          }

          // Native Hair when not obscured by full hat
          if (!hat || hat === 'headphones') {
            if (h === 'afro') {
              ctx.beginPath();
              ctx.arc(0, -108, 30, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            } else if (h === 'topbun') {
              // Sleek hair + high bun
              ctx.beginPath();
              ctx.ellipse(0, -108, 22, 14, 0, Math.PI, 0, true);
              ctx.fill();
              // The top bun sphere
              ctx.beginPath();
              ctx.arc(0, -132, 12, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            } else if (h === 'bob') {
              // Sharp geometric bob haircut
              ctx.beginPath();
              ctx.moveTo(-24, -86);
              ctx.lineTo(-24, -114);
              ctx.quadraticCurveTo(0, -125, 24, -114);
              ctx.lineTo(24, -86);
              ctx.quadraticCurveTo(18, -96, 16, -106);
              ctx.quadraticCurveTo(0, -108, -16, -106);
              ctx.quadraticCurveTo(-18, -96, -24, -86);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            } else if (h === 'curls') {
              // Scalloped cloud-like curls
              ctx.beginPath();
              ctx.arc(-16, -112, 12, 0, Math.PI * 2);
              ctx.arc(0, -122, 13, 0, Math.PI * 2);
              ctx.arc(16, -112, 12, 0, Math.PI * 2);
              ctx.arc(-22, -98, 10, 0, Math.PI * 2);
              ctx.arc(22, -98, 10, 0, Math.PI * 2);
              ctx.fill();
            } else if (h === 'messy') {
              // Spiky editorial texture
              ctx.beginPath();
              ctx.moveTo(-20, -104);
              ctx.lineTo(-26, -120);
              ctx.lineTo(-12, -124);
              ctx.lineTo(-2, -132);
              ctx.lineTo(8, -122);
              ctx.lineTo(22, -126);
              ctx.lineTo(22, -104);
              ctx.quadraticCurveTo(0, -108, -20, -104);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            } else if (h === 'long_straight') {
              // Flowing past shoulders
              ctx.beginPath();
              ctx.moveTo(-24, -40);
              ctx.lineTo(-24, -114);
              ctx.quadraticCurveTo(0, -124, 24, -114);
              ctx.lineTo(24, -40);
              ctx.lineTo(19, -40);
              ctx.lineTo(19, -96);
              ctx.quadraticCurveTo(0, -106, -19, -96);
              ctx.lineTo(-19, -40);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            } else {
              // Crop / short haircut
              ctx.beginPath();
              ctx.ellipse(0, -108, 23, 14, 0, Math.PI, 0, true);
              ctx.quadraticCurveTo(23, -103, 0, -105);
              ctx.quadraticCurveTo(-23, -103, -23, -108);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          }

          ctx.restore();
        }
      }

      function initCharacters() {
        characters = [];
        // Calculate appropriate character density based on screen width
        // Wide desktop: ~48-56 characters; mobile: ~24-28 characters
        const baseCount = Math.max(26, Math.min(62, Math.floor(width / 26)));
        if (countDisplay) {
          countDisplay.innerText = `${baseCount} CHARACTERS`;
        }

        // Staggered initial distribution across width
        for (let i = 0; i < baseCount; i++) {
          // Even spread with randomized jitter to populate immediate view
          const initialX = (i / baseCount) * (width + 300) - 150 + (Math.random() - 0.5) * 80;
          const char = new Character(initialX);
          characters.push(char);
        }

        // Sort by layer so background renders first, foreground in front (z-depth)
        sortCharacters();
      }

      function sortCharacters() {
        characters.sort((a, b) => {
          if (a.layer !== b.layer) {
            return a.layer - b.layer;
          }
          return a.yOffset - b.yOffset;
        });
      }

      let lastTime = performance.now();

      function animate(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1); // clamp dt to prevent jumps on tab focus
        lastTime = now;

        // Clear canvas with pure white
        ctx.clearRect(0, 0, width, height);

        // Update positions
        for (let i = 0; i < characters.length; i++) {
          characters[i].update(dt);
        }

        // Draw sorted by depth
        for (let i = 0; i < characters.length; i++) {
          characters[i].draw(ctx);
        }

        // Draw crisp horizontal hairline baseline along the bottom boundary
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, height - 0.5);
        ctx.lineTo(width, height - 0.5);
        ctx.stroke();

        animationFrameId = requestAnimationFrame(animate);
      }

      // Handle window resizing
      window.addEventListener('resize', () => {
        resize();
        sortCharacters();
      });

      // Initialize
      resize();
      animationFrameId = requestAnimationFrame(animate);

      // Check prefers-reduced-motion
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        cancelAnimationFrame(animationFrameId);
        // Render one static balanced frame
        ctx.clearRect(0, 0, width, height);
        characters.forEach(c => c.draw(ctx));
      }
    })();
  </script>
</body>
</html>
